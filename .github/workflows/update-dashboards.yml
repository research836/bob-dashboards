name: Update dashboard data

on:
  schedule:
    - cron: "0 12 * * 1"   # every Monday, 12:00 UTC (6 or 7 am Central)
  workflow_dispatch:         # adds a "Run workflow" button for on-demand updates

permissions:
  contents: write

concurrency:
  group: update-dashboards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Build dashboard data from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python build_dashboards.py
      - name: Publish
        run: |
          git config user.name "bob-dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Update dashboard data"
            git push
          fi
